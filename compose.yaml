services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: annotation_platform
      POSTGRES_USER: annotation_platform
      POSTGRES_PASSWORD: annotation_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U annotation_platform -d annotation_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
